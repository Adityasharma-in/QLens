<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searching image…</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101014;
    --fg: #e8e8ef;
    --muted: rgba(232, 232, 239, 0.65);
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --skel: rgba(255, 255, 255, 0.09);
    --skel-hi: rgba(255, 255, 255, 0.17);
    --accent: #6366f1;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5fb;
    --fg: #191c26;
    --muted: rgba(25, 28, 38, 0.62);
    --card-bg: rgba(255, 255, 255, 0.82);
    --card-border: rgba(120, 125, 150, 0.28);
    --skel: rgba(25, 28, 38, 0.08);
    --skel-hi: rgba(25, 28, 38, 0.15);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f5fb;
      --fg: #191c26;
      --muted: rgba(25, 28, 38, 0.62);
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(120, 125, 150, 0.28);
      --skel: rgba(25, 28, 38, 0.08);
      --skel-hi: rgba(25, 28, 38, 0.15);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    backdrop-filter: blur(12px);
  }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid var(--skel-hi);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    font-size: 13px;
    margin: 0;
    color: var(--muted);
  }
  .skel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
  }
  .skel-line {
    display: block;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--skel) 25%, var(--skel-hi) 50%, var(--skel) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  .skel-line:nth-child(1) { width: 92%; }
  .skel-line:nth-child(2) { width: 70%; margin: 0 auto; }
  .skel-line:nth-child(3) { width: 80%; margin: 0 auto; }
  @keyframes shimmer {
    to { background-position: -200% 0; }
  }
  [hidden] { display: none !important; }
  #qlens-thumb {
    display: block;
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 12px;
    margin: 0 auto 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  #qlens-loading-name {
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #qlens-cancel {
    margin-top: 20px;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 6px 20px;
    cursor: pointer;
  }
  #qlens-cancel:hover {
    color: var(--fg);
    border-color: var(--muted);
  }
  #qlens-cancel:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #qlens-error h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  #qlens-error .qlens-error-tip {
    margin-top: 8px;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .skel-line { animation: none !important; }
  }
</style>
<script src="./loading.js"></script>
</head>
<body>
<main class="card" role="status" aria-live="polite">
<img id="qlens-thumb" hidden alt="">
<div class="spinner" aria-hidden="true"></div>
<h1>Searching image with Lens…</h1>
<p id="qlens-loading-name" hidden></p>
<p id="qlens-loading-sub">Uploading — results will appear here.</p>
<div class="skel" aria-hidden="true">
<span class="skel-line"></span>
<span class="skel-line"></span>
<span class="skel-line"></span>
</div>
<button id="qlens-cancel" type="button">Cancel</button>
<div id="qlens-error" hidden role="alert">
<h2>Image search failed</h2>
<p>Image search failed — close this tab and try again.</p>
<p class="qlens-error-tip">Tip: press Ctrl+Shift+K to start a new search.</p>
</div>
</main>
</body>
</html>
